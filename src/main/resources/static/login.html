<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juan’S POS — Iniciar sesión</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="login-body"><main class="login-card"><div class="brand-icon">J<span>’</span></div><h1>Juan'S POS</h1><p>Ventas e inventario · Minimarket familiar</p><form method="post" action="/login"><label>Usuario<input type="text" name="username" autocomplete="username" required autofocus placeholder="Ej. admin"></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required placeholder="Contraseña"></label><input type="hidden" name="_csrf" id="csrf"><button type="submit" class="primary full">Ingresar al sistema</button></form><div id="loginMsg" class="notice" style="display:none"></div></main><script>fetch('/api/csrf').then(r=>r.json()).then(x=>document.getElementById('csrf').value=x.token).catch(()=>{});const p=new URLSearchParams(location.search);if(p.has('error')||p.has('logout')){let e=document.getElementById('loginMsg');e.style.display='block';e.textContent=p.has('error')?'Usuario o contraseña incorrectos':'Sesión finalizada correctamente'}</script></body></html>
