# Perfil MySQL para desarrollo local: crea juans_db desde Workbench.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:juans_db}?useSSL=false&serverTimezone=America%2FLima
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:juans_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
juans.demo.seed=${DEMO_SEED:false}
