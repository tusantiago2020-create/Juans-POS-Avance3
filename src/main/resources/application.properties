spring.application.name=JuanS-POS
server.port=${PORT:8080}
# En el perfil por defecto se usa H2 persistente para que la demostración funcione sin MySQL.
spring.datasource.url=jdbc:h2:file:./datos/juans;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
logging.level.org.springframework.security=WARN
juans.demo.seed=true

# MDC: contexto por petición, sin contraseñas, tokens ni datos de clientes.
# Los guiones :- definen valores por defecto para eventos que no son peticiones HTTP.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [usuario=%X{usuario:-sistema}] [requestId=%X{requestId:-sin-http}] [operacion=%X{operacion:-general}] [evento=%X{evento:-ninguno}] %logger{36} - %msg%n

